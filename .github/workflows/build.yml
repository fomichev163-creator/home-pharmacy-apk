name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка Java 17 (для Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Подготовка папки www и установка Capacitor
        run: |
          npm install
          npm run build
          npx cap init "Домашняя аптечка" "com.vladimir.pharmacy" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Home-Pharmacy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
